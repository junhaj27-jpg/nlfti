services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: medai, POSTGRES_USER: medai, POSTGRES_PASSWORD: medai}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  django:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: {DATABASE_URL: postgresql://medai:medai@db:5432/medai, DJANGO_ALLOWED_HOSTS: "*"}
    ports: ["8000:8000"]
    volumes: [.:/app, media:/app/media]
    depends_on: [db]
  api:
    build: .
    command: uvicorn analysis_api.main:app --host 0.0.0.0 --port 8001
    ports: ["8001:8001"]
volumes: {postgres_data: {}, media: {}}
