{% extends "base.html" %}{% block content %}<h1>2D AI 마스크 보정</h1><div class="alert alert-warning">원본 AI 마스크는 변경되지 않으며, 저장하면 별도 수정본과 재검토 기록이 생성됩니다.</div><div class="row"><div class="col-md-8"><canvas id="editor" class="border w-100" style="image-rendering:pixelated"></canvas></div><div class="col-md-4"><label>Slice <input id="slice" type="range" min="0" max="{{ shape.2|add:'-1' }}" value="{{ initial_slice }}" class="form-range"></label><label>작업<select id="mode" class="form-select"><option value="add">추가</option><option value="remove">제거</option></select></label><label>영역<select id="label" class="form-select"><option value="1">전체 종양</option><option value="2">종양 핵심</option><option value="4">조영증강</option></select></label><label>브러시 <input id="radius" type="range" min="1" max="30" value="5"></label><label>수정 이유<textarea id="reason" class="form-control" required></textarea></label><button id="save" class="btn btn-primary mt-3">수정본 저장·재검토 시작</button></div></div>
<script>const canvas=document.getElementById('editor'),ctx=canvas.getContext('2d'),slider=document.getElementById('slice');let strokes=[],drawing=false,current=null;function load(){const img=new Image();img.onload=()=>{canvas.width=img.width;canvas.height=img.height;ctx.drawImage(img,0,0)};img.src=`{% url 'mask_slice' result.pk 0 %}`.replace('/0.png',`/${slider.value}.png`)}slider.onchange=()=>{strokes=[];load()};function point(e){const r=canvas.getBoundingClientRect();return [Math.round((e.clientX-r.left)*canvas.width/r.width),Math.round((e.clientY-r.top)*canvas.height/r.height)]}canvas.onpointerdown=e=>{drawing=true;current={mode:mode.value,label:+label.value,radius:+radius.value,points:[point(e)]};strokes.push(current)};canvas.onpointermove=e=>{if(!drawing)return;const p=point(e);current.points.push(p);ctx.fillStyle=current.mode==='add'?'rgba(255,0,0,.55)':'rgba(0,0,0,.75)';ctx.beginPath();ctx.arc(p[0],p[1],current.radius,0,Math.PI*2);ctx.fill()};canvas.onpointerup=()=>drawing=false;document.getElementById('save').onclick=async()=>{const response=await fetch('{% url "mask_correction_create" result.pk %}',{method:'POST',headers:{'X-CSRFToken':'{{ csrf_token }}','Content-Type':'application/json'},body:JSON.stringify({slice:+slider.value,reason:reason.value,strokes})});const body=await response.json();if(response.ok)location.href=body.redirect;else alert(body.error)};load();</script>{% endblock %}
