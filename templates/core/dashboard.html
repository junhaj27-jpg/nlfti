{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><div><h1>프로젝트</h1><p>현재 역할: <span class="badge bg-secondary">{{ role|default:"미지정" }}</span></p></div>{% if role == "ANALYST" or role == "ADMIN" %}<a class="btn btn-primary h-50" href="{% url 'project_create' %}">새 프로젝트</a>{% endif %}</div><div class="list-group">{% for p in projects %}<a class="list-group-item list-group-item-action" href="{% url 'project_detail' p.pk %}">{{ p.title }} <small class="text-muted">{{ p.created_at }}</small></a>{% empty %}<div class="alert alert-secondary">등록된 프로젝트가 없습니다.</div>{% endfor %}</div>{% endblock %}
