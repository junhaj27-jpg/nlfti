<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedAI RA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="/">MedAI 검증 플랫폼</a>{% if user.is_authenticated %}<div class="text-white">{{ user.username }} <form class="d-inline" method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">로그아웃</button></form></div>{% endif %}</div></nav>
<main class="container py-4">{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<footer class="container pb-4 text-danger fw-semibold">본 서비스는 연구·포트폴리오용이며 의료진의 진단을 대체하지 않는다.</footer></body></html>
